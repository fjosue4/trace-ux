<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraceUX</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong palette.
      // useTheme() takes over from here and keeps the choice in localStorage.
      (function () {
        var t;
        try { t = localStorage.getItem('trace_ux_theme'); } catch (e) { /* storage blocked */ }
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
