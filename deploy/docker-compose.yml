services:
  trace-ux:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      # Change this before exposing the dashboard publicly.
      TRACE_UX_PASSWORD: ${TRACE_UX_PASSWORD:-trace-ux}
      TRACE_UX_RETENTION_DAYS: ${TRACE_UX_RETENTION_DAYS:-90}
    restart: unless-stopped

  # Optional: automatic HTTPS in front of TraceUX. Uncomment, set your
  # domain, and point DNS at this host.
