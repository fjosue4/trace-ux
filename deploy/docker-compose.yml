services:
  webshots:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      # Change this before exposing the dashboard publicly.
      WS_PASSWORD: ${WS_PASSWORD:-webshots}
      WS_RETENTION_DAYS: ${WS_RETENTION_DAYS:-90}
    restart: unless-stopped

  # Optional: automatic HTTPS in front of Webshots. Uncomment, set your
  # domain, and point DNS at this host.
